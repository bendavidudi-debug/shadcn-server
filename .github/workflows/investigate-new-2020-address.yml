name: Investigate new 2020 complaint address

on:
  pull_request:
    paths:
      - 'btc_forensic/new2020_trigger.txt'

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fresh public-blockchain investigation
        run: python3 btc_forensic/investigate_2020_new_address.py
      - uses: actions/upload-artifact@v4
        with:
          name: new-2020-address-investigation
          path: btc_forensic/new2020_address_out/
          retention-days: 7
