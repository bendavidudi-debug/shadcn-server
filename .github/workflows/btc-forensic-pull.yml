name: BTC forensic fresh pull
on:
  push:
    paths:
      - 'btc_forensic/addresses.json'
      - 'btc_forensic/pull_shard.py'
      - '.github/workflows/btc-forensic-pull.yml'
  pull_request:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pull:
    if: github.event_name != 'issues' || github.event.issue.title == 'TRIGGER BTC FORENSIC PARALLEL'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Mark run started
        shell: bash
        run: |
          date -u +'%Y-%m-%dT%H:%M:%SZ' > btc_forensic/RUN_STARTED.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add btc_forensic/RUN_STARTED.txt
          git commit -m "BTC forensic pull started" || true
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Fresh blockchain pull — 16 parallel workers
        shell: bash
        run: |
          set -euo pipefail
          rm -rf btc_forensic/out
          mkdir -p btc_forensic/out
          pids=()
          for i in $(seq 0 15); do
            echo "starting shard $i"
            SHARD_INDEX=$i SHARD_COUNT=16 python3 btc_forensic/pull_shard.py > "btc_forensic/shard_${i}.log" 2>&1 &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do
            wait "$pid"
          done
          echo "all shards finished"
          cat btc_forensic/shard_*.log
      - name: Commit fresh outputs
        shell: bash
        run: |
          git add btc_forensic/out/
          git commit -m "Fresh BTC blockchain pull outputs" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: btc-forensic-all-shards
          path: btc_forensic/out/
          retention-days: 7
