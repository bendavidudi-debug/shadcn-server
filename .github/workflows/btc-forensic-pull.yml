name: BTC forensic fresh pull
on:
  push:
    paths:
      - 'btc_forensic/addresses.json'
      - 'btc_forensic/pull.py'
      - '.github/workflows/btc-forensic-pull.yml'
  issues:
    types: [opened]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pull:
    if: github.event_name != 'issues' || github.event.issue.title == 'TRIGGER BTC FORENSIC PULL'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Fresh blockchain pull
        run: python3 btc_forensic/pull.py
      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add btc_forensic/out/
          git commit -m "Update fresh BTC forensic outputs" || exit 0
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: btc-forensic-output
          path: btc_forensic/out/
          retention-days: 7
